<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Web</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Emotion</h1>
    <p id="platform" class="muted"></p>
    <textarea id="text" rows="2" placeholder="Message"></textarea>
    <section class="card">
        <div id="mood" class="mood"></div>
        <div class="label">Emotions</div>
        <div id="emotions"></div>
        <div class="label">Basic emotions</div>
        <div id="basic"></div>
        <p id="timing" class="muted small"></p>
    </section>
    <h2>Try</h2>
    <div id="examples" class="row"></div>
    <p class="muted small">English · 28 emotions · runs on this device · no network, no permission</p>
    <p id="load" class="muted small"></p>
</main>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
